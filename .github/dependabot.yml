version: 2
updates:
  # The workflow sat on retired runner images and archived actions for four
  # years because nothing was watching it. This keeps that from recurring.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
