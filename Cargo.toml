[package]
name = "clipboard-cli"
version = "0.0.7"
edition = "2021"
rust-version = "1.86"
authors = ["Amila Welihinda <amilajack@gmail.com>"]
license = "MIT"
description = "A better command line clipboard"
readme = "README.md"
homepage = "https://github.com/amilajack/clipboard"
repository = "https://github.com/amilajack/clipboard"
keywords = ["cli", "clipboard", "pipe"]
categories = ["command-line-utilities"]

[[bin]]
name = "cb"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
dirs = "6.0"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
# bat's syntaxes and themes, so previews look the way they do in `bat`.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Platform clipboard APIs that arboard already builds on, for what it doesn't
# offer: whether a copy is marked as secret, and word of when the clipboard
# changes.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "emscripten"))))'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"
x11rb = { version = "0.13", features = ["xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["monitor"] }
