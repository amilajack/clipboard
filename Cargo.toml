[package]
name = "clipboard-cli"
version = "0.0.1"
edition = "2021"
rust-version = "1.86"
authors = ["Amila Welihinda <amilajack@gmail.com>"]
license = "MIT"
description = "A better command line clipboard"
readme = "README.md"
homepage = "https://github.com/amilajack/clipboard"
repository = "https://github.com/amilajack/clipboard"
keywords = ["cli", "clipboard", "pipe"]
categories = ["command-line-utilities"]

[[bin]]
name = "cb"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
